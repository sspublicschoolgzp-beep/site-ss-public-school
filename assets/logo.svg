<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90" fill="none">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#047857"/>
            <stop offset="100%" stop-color="#10b981"/>
        </linearGradient>
        <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#047857"/>
            <stop offset="100%" stop-color="#10b981"/>
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#047857" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Emblem Container (Squircle) -->
    <rect x="8" y="8" width="74" height="74" rx="22" fill="url(#grad1)" filter="url(#shadow)"/>
    
    <!-- Emblem Motif -->
    <g transform="translate(0, 0)">
        
        <!-- Open Book & Knowledge Cap -->
        <path d="M50 46 C42 40 32 38 22 40 V66 C32 64 42 66 50 72 C58 66 68 64 78 66 V40 C68 38 58 40 50 46 Z" fill="white" opacity="0.95"/>
        <polygon points="50,20 74,30 50,40 26,30" fill="white"/>
        <polygon points="50,24 68,30 50,36 32,30" fill="url(#grad2)"/>
    
    </g>

    <!-- Monogram Initial Corner Accent -->
    <circle cx="68" cy="22" r="11" fill="white" filter="url(#shadow)"/>
    <text x="68" y="26" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">S</text>

    <!-- Wordmark Typography -->
    <text x="96" y="44" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
        SS Public
    </text>
    <text x="96" y="64" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="11" font-weight="600" fill="#047857" letter-spacing="1.2">
        COACHING, SCHOOL & TUITI
    </text>
</svg>